<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Will You Be My Valentine, Mundu?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Pixelify+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="pixel-sky" aria-hidden="true"></div>
    <div class="floaties" aria-hidden="true">
      <svg class="floaty heart h1" viewBox="0 0 8 7" shape-rendering="crispEdges">
        <rect x="1" y="0" width="2" height="1" fill="#ff5a8a" />
        <rect x="5" y="0" width="2" height="1" fill="#ff5a8a" />
        <rect x="0" y="1" width="8" height="1" fill="#ff5a8a" />
        <rect x="0" y="2" width="8" height="1" fill="#ff5a8a" />
        <rect x="1" y="3" width="6" height="1" fill="#ff5a8a" />
        <rect x="2" y="4" width="4" height="1" fill="#ff5a8a" />
        <rect x="3" y="5" width="2" height="1" fill="#ff5a8a" />
      </svg>
      <svg class="floaty heart h2" viewBox="0 0 8 7" shape-rendering="crispEdges">
        <rect x="1" y="0" width="2" height="1" fill="#ff7fb0" />
        <rect x="5" y="0" width="2" height="1" fill="#ff7fb0" />
        <rect x="0" y="1" width="8" height="1" fill="#ff7fb0" />
        <rect x="0" y="2" width="8" height="1" fill="#ff7fb0" />
        <rect x="1" y="3" width="6" height="1" fill="#ff7fb0" />
        <rect x="2" y="4" width="4" height="1" fill="#ff7fb0" />
        <rect x="3" y="5" width="2" height="1" fill="#ff7fb0" />
      </svg>
      <svg class="floaty heart h3" viewBox="0 0 8 7" shape-rendering="crispEdges">
        <rect x="1" y="0" width="2" height="1" fill="#ff3d62" />
        <rect x="5" y="0" width="2" height="1" fill="#ff3d62" />
        <rect x="0" y="1" width="8" height="1" fill="#ff3d62" />
        <rect x="0" y="2" width="8" height="1" fill="#ff3d62" />
        <rect x="1" y="3" width="6" height="1" fill="#ff3d62" />
        <rect x="2" y="4" width="4" height="1" fill="#ff3d62" />
        <rect x="3" y="5" width="2" height="1" fill="#ff3d62" />
      </svg>
      <svg class="floaty sparkle s1" viewBox="0 0 7 7" shape-rendering="crispEdges">
        <rect x="3" y="0" width="1" height="7" fill="#ffe9b0" />
        <rect x="0" y="3" width="7" height="1" fill="#ffe9b0" />
        <rect x="2" y="2" width="3" height="3" fill="#fff" />
      </svg>
      <svg class="floaty sparkle s2" viewBox="0 0 7 7" shape-rendering="crispEdges">
        <rect x="3" y="0" width="1" height="7" fill="#fff3d1" />
        <rect x="0" y="3" width="7" height="1" fill="#fff3d1" />
        <rect x="2" y="2" width="3" height="3" fill="#fff" />
      </svg>
    </div>

    <main class="valentine">
      <section class="card" aria-labelledby="title">
        <div class="card-header">
          <h1 id="title">Will You Be My Valentine, Mundu?</h1>
          <p class="subtitle">A tiny pixel promise, just for you.</p>
        </div>

        <div class="scene">
          <div class="animals" aria-hidden="true">
            <svg class="sprite bunny" viewBox="0 0 16 16" shape-rendering="crispEdges">
              <rect x="5" y="0" width="2" height="6" fill="#ffeef8" />
              <rect x="9" y="0" width="2" height="6" fill="#ffeef8" />
              <rect x="6" y="2" width="1" height="3" fill="#ffc8df" />
              <rect x="10" y="2" width="1" height="3" fill="#ffc8df" />
              <rect x="3" y="5" width="10" height="8" fill="#fff7fd" />
              <rect x="4" y="6" width="8" height="6" fill="#ffeef8" />
              <rect x="6" y="8" width="1" height="1" fill="#6d4b5f" />
              <rect x="9" y="8" width="1" height="1" fill="#6d4b5f" />
              <rect x="7" y="9" width="2" height="1" fill="#ff87b6" />
              <rect x="5" y="10" width="1" height="1" fill="#ffb7d5" />
              <rect x="10" y="10" width="1" height="1" fill="#ffb7d5" />
            </svg>

            <svg class="sprite kitty" viewBox="0 0 16 16" shape-rendering="crispEdges">
              <rect x="2" y="4" width="12" height="9" fill="#ffd1e8" />
              <rect x="3" y="3" width="3" height="3" fill="#ff9fc6" />
              <rect x="10" y="3" width="3" height="3" fill="#ff9fc6" />
              <rect x="5" y="6" width="6" height="6" fill="#ffeef8" />
              <rect x="6" y="8" width="1" height="1" fill="#6d4b5f" />
              <rect x="9" y="8" width="1" height="1" fill="#6d4b5f" />
              <rect x="7" y="9" width="2" height="1" fill="#ff7aa9" />
              <rect x="4" y="10" width="1" height="1" fill="#ffb7d5" />
              <rect x="11" y="10" width="1" height="1" fill="#ffb7d5" />
            </svg>

            <svg class="sprite pup" viewBox="0 0 16 16" shape-rendering="crispEdges">
              <rect x="2" y="4" width="12" height="9" fill="#f4d1b7" />
              <rect x="1" y="4" width="3" height="5" fill="#d8a77f" />
              <rect x="12" y="4" width="3" height="5" fill="#d8a77f" />
              <rect x="4" y="6" width="8" height="6" fill="#fbe3d1" />
              <rect x="6" y="8" width="1" height="1" fill="#6d4b5f" />
              <rect x="9" y="8" width="1" height="1" fill="#6d4b5f" />
              <rect x="7" y="9" width="2" height="1" fill="#ff7aa9" />
              <rect x="6" y="11" width="4" height="1" fill="#b77a56" />
            </svg>
          </div>

          <div class="flowers" aria-hidden="true">
            <svg class="sprite flower f1" viewBox="0 0 12 12" shape-rendering="crispEdges">
              <rect x="4" y="0" width="4" height="4" fill="#ff7fb0" />
              <rect x="0" y="4" width="4" height="4" fill="#ff9ac7" />
              <rect x="8" y="4" width="4" height="4" fill="#ff9ac7" />
              <rect x="4" y="8" width="4" height="4" fill="#ff7fb0" />
              <rect x="4" y="4" width="4" height="4" fill="#ffd36f" />
            </svg>
            <svg class="sprite flower f2" viewBox="0 0 12 12" shape-rendering="crispEdges">
              <rect x="4" y="0" width="4" height="4" fill="#b48bff" />
              <rect x="0" y="4" width="4" height="4" fill="#d2b7ff" />
              <rect x="8" y="4" width="4" height="4" fill="#d2b7ff" />
              <rect x="4" y="8" width="4" height="4" fill="#b48bff" />
              <rect x="4" y="4" width="4" height="4" fill="#fff3b3" />
            </svg>
            <svg class="sprite flower f3" viewBox="0 0 12 12" shape-rendering="crispEdges">
              <rect x="4" y="0" width="4" height="4" fill="#ff4d6d" />
              <rect x="0" y="4" width="4" height="4" fill="#ff8aa1" />
              <rect x="8" y="4" width="4" height="4" fill="#ff8aa1" />
              <rect x="4" y="8" width="4" height="4" fill="#ff4d6d" />
              <rect x="4" y="4" width="4" height="4" fill="#ffe9b0" />
            </svg>
          </div>
        </div>

        <div class="buttons" aria-live="polite">
          <button id="yesBtn" class="pixel-btn yes">Yes!</button>
          <button id="noBtn" class="pixel-btn no" aria-label="No">No</button>
          <p id="yesHint" class="yes-hint" aria-live="polite">Click again for a surprise!</p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
